<!DOCTYPE html>
<html>
<head>
       <title>Registration Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
            width: 400px;
        }

        h2 {
            text-align: center;
            color: #333;
        }

        label {
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #218838;
        }

        #message {
            margin-top: 15px;
            text-align: center;
            color: green;
            font-weight: bold;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>FACULTY REGISTRATION FORM</h2>

    <form id="registrationForm">
    <label for="firstname">First Name</label>
    <input type="text" id="firstname" required>
    <br> 
    <label for="lastname">Last Name</label>
    <input type="text" id="lastname" required>
    <br>
<label for="facid">Faculty ID</label>
    <input type="text" id="facid" required>
<br>
    <label for="phone">Phone Number</label>
    <input type="tel" id="phone" pattern="[0-9]{10}" placeholder="10-digit phone number" required>
    <br>
    <label for="gmail">Gmail</label>
    <input type="email" id="gmail" placeholder="example@gmail.com" required>
    <br>
   <label for="branch">Branch</label>
<input type="text" id="branch" required>
<br>
<label for="des">Designation</label>
<input type="text" id="des" required>
<br>
    <button type="submit">Register</button>
    </form>
  <div id="message">Thank you for registering!</div>
</div>
<script>
    document.getElementById("registrationForm").addEventListener("submit", function(event) {
        event.preventDefault();        
        document.getElementById("message").style.display = "block";
    });
</script>
</body>
</html>
